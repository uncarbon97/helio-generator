<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helium 代码生成器</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <style>
        :root {
            --font-sans: "Microsoft YaHei", "PingFang SC", ui-sans-serif, system-ui, sans-serif,
                         "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }
    </style>
    <script defer src="libs/alpine.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased" x-data="generator">

<!-- 顶部栏 -->
<header class="border-b border-gray-200 bg-white">
    <div class="mx-auto max-w-7xl px-6 flex items-center justify-between h-14">
        <div class="flex items-center gap-2">
            <span class="text-lg font-bold tracking-tight">Helio</span>
            <span class="text-sm text-gray-500">代码生成器</span>
        </div>
        <div class="flex items-center gap-4 text-sm">
            <a href="https://gitee.com/uncarbon97" target="_blank" class="text-gray-500 hover:text-gray-900 transition">Gitee</a>
            <a href="https://github.com/uncarbon97" target="_blank"
               class="text-gray-500 hover:text-gray-900 transition">GitHub</a>
        </div>
    </div>
</header>

<main class="mx-auto max-w-7xl px-6 py-8">

    <!-- 生成选项区域 -->
    <div class="space-y-6">

        <!-- 包名设置 -->
        <section class="bg-white rounded-lg border border-gray-200 p-6">
            <h3 class="text-sm font-semibold mb-4">包名设置</h3>
            <div class="flex flex-wrap items-end gap-4">
                <label class="flex flex-col gap-1">
                    <span class="text-xs text-gray-500">package</span>
                    <span class="text-sm text-gray-400">主要包名</span>
                    <input type="text" x-model="settings.package"
                           class="h-9 w-56 px-3 rounded-md border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </label>
                <label class="flex flex-col gap-1">
                    <span class="text-xs text-gray-500">moduleName</span>
                    <span class="text-sm text-gray-400">模块名</span>
                    <input type="text" x-model="settings.moduleName"
                           class="h-9 w-36 px-3 rounded-md border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </label>
                <label class="flex flex-col gap-1">
                    <span class="text-xs text-gray-500">tablePrefix</span>
                    <span class="text-sm text-gray-400">被裁切的数据表前缀，可留空</span>
                    <input type="text" x-model="settings.tablePrefix"
                           class="h-9 w-36 px-3 rounded-md border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </label>
                <button @click="saveSettings"
                        class="h-9 px-4 rounded-md bg-green-600 text-white text-sm font-medium hover:bg-green-700 transition">
                    保存设置
                </button>
            </div>
        </section>

        <!-- 脚手架架构；不过 4.x 开始暂时不用了，隐藏起来 -->
        <section class="bg-white rounded-lg border border-gray-200 p-6" style="display: none">
            <h3 class="text-sm font-semibold mb-4">脚手架架构</h3>
            <div class="flex gap-6">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" x-model="options.backendArch" value="standalone" class="text-blue-600">
                    <span class="text-sm">单体</span>
                </label>
            </div>
        </section>

        <!-- 其他选项 -->
        <section class="bg-white rounded-lg border border-gray-200 p-6">
            <h3 class="text-sm font-semibold mb-4">其他选项</h3>
            <div class="flex flex-wrap gap-x-6 gap-y-3">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" x-model="options.queryFormSchema"
                           class="rounded border-gray-300 text-blue-600">
                    <span class="text-sm">生成分页列表查询条件</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" x-model="options.mybatisXML" class="rounded border-gray-300 text-blue-600">
                    <span class="text-sm">生成配套 Mapper.xml</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" x-model="options.useYesOrNoEnum"
                           class="rounded border-gray-300 text-blue-600">
                    <span class="text-sm">对 _flag 结尾或 is_ 开头的字段，Java 代码使用 YesOrNoEnum 枚举</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" x-model="options.useEnabledStatusEnum"
                           class="rounded border-gray-300 text-blue-600">
                    <span class="text-sm">对 status 结尾的字段，Java 代码使用 EnabledStatusEnum 枚举</span>
                </label>
            </div>
        </section>

        <!-- 搜索栏 -->
        <div class="flex items-center gap-3 mb-6">
            <input
                    type="text"
                    x-model="searchTableName"
                    @keydown.enter="query"
                    placeholder="搜索表名..."
                    class="flex-1 max-w-xs h-9 px-3 rounded-md border border-gray-300 bg-white text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
            <button @click="query"
                    class="h-9 px-4 rounded-md bg-white border border-gray-300 text-sm font-medium hover:bg-gray-50 transition">
                查询
            </button>
            <button @click="generate"
                    class="h-9 px-4 rounded-md bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 transition">
                生成代码
            </button>
        </div>

        <!-- 表格 -->
        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden mb-6">
            <table class="w-full text-sm">
                <thead>
                <tr class="border-b border-gray-200 bg-gray-50/80">
                    <th class="w-10 px-4 py-2.5 text-left">
                        <input type="checkbox" x-model="selectAll" @change="toggleSelectAll"
                               class="rounded border-gray-300">
                    </th>
                    <th class="px-4 py-2.5 text-left font-medium text-gray-600">表名</th>
                    <th class="px-4 py-2.5 text-left font-medium text-gray-600 w-24">Engine</th>
                    <th class="px-4 py-2.5 text-left font-medium text-gray-600">表备注</th>
                    <th class="px-4 py-2.5 text-left font-medium text-gray-600 w-48">创建时间</th>
                </tr>
                </thead>
                <tbody>
                <template x-for="row in tableData" :key="row.tableName">
                    <tr class="border-b border-gray-100 last:border-0 hover:bg-gray-50/50 transition">
                        <td class="px-4 py-2.5">
                            <input type="checkbox" :value="row.tableName" x-model="selectedTables"
                                   class="rounded border-gray-300">
                        </td>
                        <td class="px-4 py-2.5 font-mono text-xs" x-text="row.tableName"></td>
                        <td class="px-4 py-2.5 text-gray-500" x-text="row.engine"></td>
                        <td class="px-4 py-2.5" x-text="row.tableComment"></td>
                        <td class="px-4 py-2.5 text-gray-500" x-text="row.createTime"></td>
                    </tr>
                </template>
                <tr x-show="tableData.length === 0">
                    <td colspan="5" class="px-4 py-12 text-center text-gray-400">暂无数据</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 分页 -->
        <div class="flex items-center justify-between mb-10 text-sm text-gray-600">
            <div class="flex items-center gap-2">
                <span>每页</span>
                <select x-model.number="pageSize" @change="loadData"
                        class="h-8 px-2 rounded-md border border-gray-300 bg-white text-sm">
                    <option value="10">10</option>
                    <option value="30">30</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                </select>
                <span>条</span>
            </div>
            <div class="flex items-center gap-1">
                <span class="mr-3" x-text="'共 ' + totalCount + ' 条'"></span>
                <template x-for="p in pageNumbers" :key="p">
                    <button
                            @click="goToPage(p)"
                            :class="p === currentPage ? 'bg-blue-600 text-white' : 'bg-white border border-gray-300 hover:bg-gray-50'"
                            class="h-8 min-w-[2rem] px-2 rounded-md text-sm transition"
                            x-text="p === '...' ? '...' : p"
                            :disabled="p === '...'"
                    ></button>
                </template>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div
            x-show="toast.show"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 translate-y-2"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2"
            class="fixed bottom-6 right-6 px-4 py-2.5 rounded-lg shadow-lg text-sm text-white"
            :class="toast.type === 'success' ? 'bg-green-600' : 'bg-red-500'"
            x-text="toast.message"
    ></div>

</main>

<script src="js/generator.js"></script>
</body>
</html>
